name: Frontend CI

# There is no npm/React frontend in this repo. "Frontend" here covers the two
# user-facing surfaces that exist: the Streamlit app (ui/) and the static
# GitHub Pages site (docs/). Neither has a real build step, so "build" means
# a compile/syntax check that would fail on a broken commit.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  streamlit-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tools
        run: python -m pip install --upgrade pip ruff

      - name: Lint Streamlit app
        run: ruff check ui/ --output-format=github
        continue-on-error: true

      - name: Compile-check Streamlit app
        run: python -m py_compile ui/app.py

  docs-site-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax-check docs JavaScript
        run: node --check docs/app.js

      - name: Validate docs HTML is well-formed
        run: python scripts/check_docs_html.py
